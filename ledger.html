<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Budget Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section id="app-screen" class="screen">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">§</span>
      <span class="brand-name">Ledger</span>
    </div>
    <div class="topbar-right">
      <span class="user-email" id="user-email"></span>
      <button class="btn-ghost" id="signout-btn">Sign out</button>
    </div>
  </header>

  <main class="app-main">

    <!-- Balance summary -->
    <section class="summary">
      <div class="summary-main">
        <span class="summary-label">Balance</span>
        <span class="summary-figure" id="balance-figure">$0.00</span>
      </div>
      <div class="summary-split">
        <div class="split-item">
          <span class="split-label">In</span>
          <span class="split-figure figure-in" id="income-figure">$0.00</span>
        </div>
        <div class="split-item">
          <span class="split-label">Out</span>
          <span class="split-figure figure-out" id="expense-figure">$0.00</span>
        </div>
      </div>
      <label class="month-picker">
        <span>Month</span>
        <input type="month" id="month-select">
      </label>
    </section>

    <!-- Add entry -->
    <section class="add-entry">
      <h2 class="section-title">Add an entry</h2>
      <form id="entry-form" class="entry-form">
        <div class="type-toggle" role="radiogroup" aria-label="Entry type">
          <button type="button" class="toggle-btn active" data-type="expense" id="toggle-expense">Money out</button>
          <button type="button" class="toggle-btn" data-type="income" id="toggle-income">Money in</button>
        </div>
        <div class="entry-grid">
          <label class="field">
            <span>Description</span>
            <input type="text" id="entry-desc" required placeholder="Groceries, rent, paycheck…">
          </label>
          <label class="field">
            <span>Amount</span>
            <input type="number" id="entry-amount" required min="0" step="0.01" placeholder="0.00">
          </label>
          <label class="field">
            <span>Category</span>
            <select id="entry-category">
              <option>General</option>
              <option>Housing</option>
              <option>Food</option>
              <option>Transport</option>
              <option>Utilities</option>
              <option>Health</option>
              <option>Entertainment</option>
              <option>Savings</option>
              <option>Income</option>
              <option>Other</option>
            </select>
          </label>
          <label class="field">
            <span>Date</span>
            <input type="date" id="entry-date" required>
          </label>
        </div>
        <button type="submit" class="btn-primary" id="entry-submit">Add entry</button>
      </form>
    </section>

    <!-- Category breakdown -->
    <section class="breakdown" id="breakdown-section" hidden>
      <h2 class="section-title">Where it went this month</h2>
      <div class="bars" id="breakdown-bars"></div>
    </section>

    <!-- Transaction ledger -->
    <section class="ledger-section">
      <h2 class="section-title">Entries</h2>
      <div class="ledger-empty" id="ledger-empty">No entries yet for this month. Add your first one above.</div>
      <div class="ledger-table" id="ledger-table" hidden>
        <div class="ledger-row ledger-header">
          <span>Date</span>
          <span>Description</span>
          <span>Category</span>
          <span class="col-amount">Amount</span>
          <span></span>
        </div>
        <div id="ledger-rows"></div>
      </div>
    </section>

  </main>
</section>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
